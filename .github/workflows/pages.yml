name: pages

# Publishes web/ as a static site. This is the deployment the README promises:
# the ladder is a small interpreter over rows, so the rows ship as JSON and the
# whole bot runs in the browser. No server process, nothing billable.
#
# Enable it once in Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install
        run: pip install -e ".[test]"

      # The site is only worth publishing if it answers the way the tested
      # runtime does, so the gate runs before the artifact is built.
      - name: build from the fixture and run the gate
        run: |
          python -m personal_chatbots build --offline --cache tests/fixtures
          python -m personal_chatbots test

      - name: export and verify the browser engine
        run: |
          python -m personal_chatbots export
          node web/parity.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
