name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow IS the regression gate. Git provides the baseline -- green on
# main, red on the branch -- which is why the project needs no test_results
# table, no run ledger, and no rollback machinery of its own.
#
# The build runs from tests/fixtures, a snapshot of real API responses, so CI
# never touches the network and never flakes on a rate limit.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: pip install -e ".[dev]"

      - name: build from the fixture (offline)
        run: python -m personal_chatbots build --offline --cache tests/fixtures

      - name: seeded cases must be green
        run: python -m personal_chatbots test

      - name: unit and invariant tests
        run: python -m unittest discover -s tests -t . -v

      # Two implementations of one interpreter drift unless something forces
      # them to agree. The browser engine runs the same content/tests.yaml the
      # Python runtime runs; this is where a divergence gets caught.
      - name: browser engine agrees with the Python runtime
        run: |
          python -m personal_chatbots export
          node web/parity.mjs

      - name: the build must be idempotent
        run: |
          python -m personal_chatbots build --offline --cache tests/fixtures --json > /tmp/second.json
          python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/second.json"))
          created = report["entities"]["created"]
          updated = report["entities"]["updated"]
          if created or updated:
              sys.exit(f"a second build changed {created} created / {updated} updated rows")
          print("idempotent: nothing changed on the second build")
          PY
