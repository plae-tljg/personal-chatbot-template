# content/knowledge.yaml
#
# 一行 = 一个问句形状 -> 一个确定性动作。这是 bot 全部"会说什么"。
#
# 三条规矩：
#   1. 模板里不能出现具体数值，只能出现 {slot} 和实体的字段（{repo.summary}）。
#      价格 / 版本 / 库存 / 日期 一律从 entities 解析 —— 这是成本要求。（CONCERNS C2）
#   2. 一行可以挂多个 patterns。多一个入口不增加一行，也不增加一次 AI 唤醒。
#   3. 引用哪来？引文自动收集：答案里用了哪个实体的字段，就自动引用它。
#      cites: 只在需要额外引用（模板没插值到）时才写。
#
# 槽位规则：pattern 里出现的 {x} 必须在 slots 里声明，且值必须是合法的 entity_type。
# 匹配时先解析槽位（必须唯一命中一个 live 实体），再把问句骨架和 pattern 骨架比对。
# 槽位解析不出来 -> 这一行不命中（不猜）。
#
# 语言：normalisation 把 CJK 按字切分，所以中文问句能匹配中文 pattern。
# 每个入口都同时给中英两种问法 —— 访客用哪种语言问，落到的都是同一行、同一个答案。

- slug: owner.intro
  patterns:
    - "who is {person}"
    - "what does {person} do"
    - "tell me about {person}"
    - "{person} 是谁"
    - "{person} 是做什么的"
    - "介绍一下 {person}"
  slots: { person: person }
  action:
    kind: answer
    template: "{person} — {person.summary}"

- slug: owner.accounts
  patterns:
    - "which accounts does {person} publish under"
    # "what" for "which" is the single most common one-word gap this bot has had.
    # It reached the model twice before anyone noticed, because a pattern that
    # does not match fails silently. `pc ask` and `pc inbox` now name the row and
    # the word.
    - "what accounts does {person} publish under"
    - "what accounts does {person} have"
    - "how many github accounts does {person} have"
    - "where does {person} publish"
    - "{person} 有几个账号"
    - "你有哪些账号"
    - "在哪些账号下发布"
  slots: { person: person }
  action:
    kind: list
    entity_type: account
    link_type: owned_by
    direction: in            # account --owned_by--> person，从 person 反向找 account
    template: "{name} — {summary}"

- slug: repo.about
  patterns:
    - "what is {repo} about"
    - "tell me about {repo}"
    - "what does {repo} do"
    # 访客会说 "the three body simulation"，冠词留在槽位外面。
    - "what is the {repo} about"
    - "tell me about the {repo}"
    - "what does the {repo} do"
    # 能力问句：访客问 "can I use the finance app offline?"，而仓库自己的 summary
    # 就写着 "completely offline"。答案还是同一句描述，多一个入口不新增行。
    - "can i use {repo} offline"
    - "can i use the {repo} offline"
    - "does {repo} work offline"
    - "does the {repo} work offline"
    - "{repo} 是什么"
    - "{repo} 是做什么的"
    - "{repo} 怎么样"
    - "介绍下 {repo}"
  slots: { repo: repo }
  action:
    kind: answer
    template: "{repo} — {repo.summary}"

# 归属是一个新的问句形状（不是 "about" 的复述）：谁做的，不是做什么。
# 答案走已有的 owned_by 链接，不写死任何人名。
- slug: repo.author
  patterns:
    - "who made {repo}"
    - "who made the {repo}"
    - "who created {repo}"
    - "who wrote {repo}"
    - "who owns {repo}"
    - "{repo} 是谁写的"
    - "{repo} 属于谁"
  slots: { repo: repo }
  action:
    kind: list
    entity_type: account
    link_type: owned_by
    direction: out           # repo --owned_by--> account
    template: "{name}"

- slug: repo.list
  patterns:
    - "what projects does {person} have"
    - "what repos does {person} have"
    - "what repositories does {person} have"
    - "list {person} work"
    - "what have {person} built"
    - "{person} 有哪些项目"
    - "{person} 做过什么"
    - "{person} 有哪些仓库"
  slots: { person: person }
  action:
    kind: list
    entity_type: repo
    order_by: "attrs.stars desc"
    limit: 10
    template: "{name} ({attrs.stars}★) — {summary}"

- slug: repo.ranked
  patterns:
    - "what is your most starred repo"
    - "what is your most popular project"
    - "which repo has the most stars"
    - "最受欢迎的项目是哪个"
    - "哪个仓库 star 最多"
  slots: {}
  action:
    kind: list
    entity_type: repo
    order_by: "attrs.stars desc"
    limit: 5
    template: "{name} ({attrs.stars}★) — {summary}"

- slug: repo.by_language
  patterns:
    - "which projects use {language}"
    - "what projects use {language}"
    - "what have you written in {language}"
    - "哪些项目用 {language}"
    - "用 {language} 写的东西有哪些"
  slots: { language: language }
  action:
    kind: list
    entity_type: repo
    link_type: uses_language
    direction: in            # repo --uses_language--> language
    template: "{name} ({attrs.language}) — {summary}"

- slug: repo.by_topic
  patterns:
    - "what have you built with {topic}"
    - "do you have anything for {topic}"
    - "do you have anything about {topic}"
    - "有没有 {topic} 相关的东西"
    - "{topic} 方面做过什么"
  slots: { topic: topic }
  action:
    kind: list
    entity_type: repo
    link_type: tagged
    direction: in            # repo --tagged--> topic
    template: "{name} — {summary}"

- slug: project.about
  patterns:
    - "what is the {project} project"
    - "what is in {project}"
    - "{project} 这个系列是什么"
    - "{project} 里有什么"
  slots: { project: project }
  action:
    kind: list
    entity_type: repo
    link_type: includes
    direction: out           # project --includes--> repo
    template: "{name} — {summary}"

- slug: contact
  patterns:
    - "how do i contact {person}"
    - "how to hire {person}"
    - "how do i reach {person}"
    - "怎么联系 {person}"
    - "怎么联系 {person}"
  slots: { person: person }
  action:
    kind: answer
    template: "Open an issue on any repo, or use the links on {person.url}."

- slug: meta.provenance
  patterns:
    - "where did you get this"
    - "how do you know that"
    - "what is your source"
    - "这些信息哪来的"
    - "你的答案从哪来"
  slots: {}
  action:
    kind: answer
    template: "From the public GitHub metadata and READMEs of the repositories listed above."

# ---------------------------------------------------------------------------
# 站点：GitHub 元数据里没有"我还有一个网站"这件事，所以地址挂在 person 的 attrs 上
# （curation.yaml）。模板只插值，不写死 URL —— 换域名只改一处。
# ---------------------------------------------------------------------------

- slug: site.home
  patterns:
    - "what is {person} website"
    - "does {person} have a website"
    - "does {person} have a blog"
    - "where does {person} write"
    - "{person} 的网站是什么"
    - "{person} 有博客吗"
    - "{person} 的主页在哪"
  slots: { person: person }
  action:
    kind: answer
    template: "{person.attrs.site} — {person.summary}"

- slug: site.projects
  patterns:
    - "where can i see all {person} projects"
    - "is there a list of {person} repositories"
    - "where are {person} repos listed"
    - "{person} 的项目在哪看"
    - "{person} 有没有项目列表"
  slots: { person: person }
  action:
    kind: answer
    template: "All of them, grouped by what they are and with demo links: {person.attrs.projects}"

- slug: site.writing
  patterns:
    - "what does {person} write about"
    - "does {person} write articles"
    - "where are {person} articles"
    - "{person} 写什么"
    - "{person} 有没有文章"
  slots: { person: person }
  action:
    kind: answer
    template: "Essays live at {person.attrs.writing} and the documentation at {person.attrs.docs}."

# 关于 bot 自己的问题，是访客最先会问的那一批；答案不依赖任何实体。
- slug: bot.intro
  patterns:
    - "who are you"
    - "what are you"
    - "你是谁"
    - "你是什么"
  slots: {}
  action:
    kind: answer
    template: "A question-answering bot for LKM's public work. Ask about a repository, an account, a language, a topic, or what I am working on."

- slug: bot.how
  patterns:
    - "how does this bot work"
    - "how do you answer"
    - "do you use an llm"
    - "do you use chatgpt"
    - "is there a server"
    - "这个机器人怎么工作的"
    - "你用大模型吗"
  slots: {}
  action:
    kind: answer
    template: "No model and no server: the answers come from SQLite rows built from public GitHub metadata, hand-written judgement, and the repositories' READMEs. Answers take well under a millisecond and cost zero tokens. Anything the tables do not cover is refused and logged rather than guessed."

- slug: bot.language
  patterns:
    - "can you answer in chinese"
    - "which languages can i ask in"
    - "你会中文吗"
    - "能用中文问吗"
  slots: {}
  action:
    kind: answer
    template: "Chinese and English both work — every row carries phrasings in both. If a question is outside the tables, it is refused rather than invented."

# ---------------------------------------------------------------------------
# 新的问句形状：时间、许可、语言清单、方向清单、账号本身、代码地址。
# 每一个问的都是"仓库描述之外"的东西，所以各占一行，而不是塞进 repo.about。
# ---------------------------------------------------------------------------

- slug: repo.newest
  patterns:
    - "what are you working on now"
    - "what is your latest project"
    - "what is your newest repo"
    - "最近在做什么"
    - "最新的项目是哪个"
  slots: {}
  action:
    kind: list
    entity_type: repo
    order_by: "attrs.pushed_at desc"
    limit: 5
    template: "{name} ({attrs.pushed_at}) — {summary}"

# 许可分两句问法：问"能不能用"要的是一句政策（判断），问"分别是什么"要的是清单（事实）。
- slug: license.policy
  patterns:
    - "what license do {person} projects use"
    - "are {person} projects open source"
    - "can i use {person} code"
    - "{person} 的项目是什么许可"
    - "{person} 的代码可以拿去用吗"
  slots: { person: person }
  action:
    kind: answer
    template: "{person.attrs.licenses}"

- slug: repo.licenses
  patterns:
    - "list the licenses"
    - "which license does each repo use"
    - "每个仓库的许可分别是什么"
  slots: {}
  action:
    kind: list
    entity_type: repo
    order_by: "name"
    limit: 10
    template: "{name} — {attrs.license}"

- slug: language.list
  patterns:
    - "what languages do you use"
    - "what languages do you code in"
    - "which programming languages do you know"
    - "你会哪些编程语言"
    - "用什么语言写代码"
  slots: {}
  action:
    kind: list
    entity_type: language
    order_by: "name"
    template: "{name}"

- slug: topic.list
  patterns:
    - "what topics do you work on"
    - "what are you interested in"
    - "你做什么方向"
    - "你对什么感兴趣"
  slots: {}
  action:
    kind: list
    entity_type: topic
    order_by: "attrs.curated desc"
    template: "{name} — {summary}"

- slug: account.about
  patterns:
    - "what is the {account} account"
    - "what is {account}"
    - "{account} 是什么账号"
    - "{account} 是干什么的"
  slots: { account: account }
  action:
    kind: answer
    template: "{account} — {account.summary}"

- slug: repo.url
  patterns:
    - "where is the code for {repo}"
    - "where can i find {repo}"
    - "give me the link to {repo}"
    - "{repo} 的代码在哪"
    - "给我 {repo} 的链接"
  slots: { repo: repo }
  action:
    kind: answer
    template: "{repo.url}"
