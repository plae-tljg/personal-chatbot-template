# content/tests.yaml
#
# 测试集。这是"后续改动不会杀死过去改进"的机制。
#
# 维护者编辑知识行的同一个回合里，必须给这次改动加一条用例（见 AGENTS.md）。
# 基线由 git 提供：main 上全绿，分支上变红 = 回归。
# 所以不需要 test_results 表 —— git 就是那张表。
#
# 断言刻意做粗：answer_contains 是子串，不是精确答案。
# 一个改个措辞就报警的测试集，人很快就会学会忽略它；那比没有更糟。

# ---- 正例：必须答出来，而且必须解析到正确的实体（防"过严"） ----
- slug: repo.about.dsh-review
  question: "what is dsh-review about?"
  expect:
    source: knowledge
    resolves: { repo: "plae-tljg/dsh-review" }
    answer_contains: ["DeepSeek Harness"]
    cites: ["plae-tljg/dsh-review"]

- slug: repo.about.mixed-naming
  question: "tell me about Finance-Management-App"
  expect:
    source: knowledge
    resolves: { repo: "plae-tljg/Finance-Management-App" }

- slug: repo.by_language.kotlin
  question: "which projects use Kotlin?"
  expect:
    source: knowledge
    answer_contains: ["MaaFwPhoneAI"]

- slug: repo.ranked.stars
  question: "what is your most starred repo?"
  expect:
    source: knowledge
    answer_contains: ["Finance-Management-App"]

# ---- 易混负例：长得像但必须不命中（防"过松"，抢别人的问题） ----
- slug: confusable.price-not-a-repo-question
  question: "what is the price of dsh-review?"
  expect:
    refuses: true

- slug: confusable.wedding-vs-project
  question: "do you do weddings?"
  expect:
    refuses: true

# ---- 拒答例：真的不知道就必须说不知道（防编造） ----
- slug: refuse.salary
  question: "how much does LKM charge per hour?"
  expect:
    refuses: true

# ---- 槽位歧义：两个仓库名字太像，必须拒绝猜，而不是挑一个（防瞎猜） ----
- slug: ambiguity.finance-app-vs-web
  question: "what is Finance-Management about?"
  expect:
    refuses: true

# ---- 命名近失误：curation alias 让访客的说法能解析到仓库（防"过严"） ----
- slug: repo.about.three-body-alias
  question: "what is the three body simulation about"   # traffic: "who made the three body simulation?"
  expect:
    source: knowledge
    resolves: { repo: "plae-lkm/ThreeBodySystemAnimation" }
    answer_contains: ["three body"]

# ---- 归属：新形状，答案来自 owned_by 链接，不是模板里的名字 ----
- slug: repo.author.three-body
  question: "who made the three body simulation?"   # verbatim from the inbox
  expect:
    source: knowledge
    resolves: { repo: "plae-lkm/ThreeBodySystemAnimation" }
    answer_contains: ["plae-lkm"]
    cites: ["plae-lkm"]

# ---- curation 分组：GitHub 没有 machine-learning topic，访客的问法必须命中 ----
- slug: repo.by_topic.machine-learning
  question: "do you have anything for machine learning?"   # verbatim from the inbox
  expect:
    source: knowledge
    answer_contains: ["GPT-SoVITS-Musa"]

# ---- 易混负例：新的宽 topic 不能吞掉已有的窄 topic ----
- slug: confusable.machine-learning-vs-learning
  question: "do you have anything for learning?"
  expect:
    source: knowledge

# ---- 易混负例：归属行有 {repo} 槽位，不能抢 "who is LKM?" 这种人物问题 ----
- slug: confusable.author-vs-person
  question: "who is LKM?"
  expect:
    source: knowledge
    resolves: { person: "plae-tljg" }

# ---- 拒答例：词表里没有 Rust，也不能凭空造一个（防编造） ----
- slug: refuse.rust-language
  question: "which projects use Rust?"   # verbatim from the inbox
  expect:
    refuses: true

# ---- 能力问句：repo.about 多一个入口，答案仍取自仓库自己的 summary ----
# summary 就是 "App to do finance management, completely offline"，
# 所以这不是新事实，只是一个新问法落到已有的行上（不新增行）。
- slug: repo.about.finance-offline
  question: "can I use the finance app offline?"   # verbatim from the inbox
  expect:
    source: knowledge
    resolves: { repo: "plae-tljg/Finance-Management-App" }
    answer_contains: ["offline"]
    cites: ["plae-tljg/Finance-Management-App"]

# ---- 易混负例：offline 入口需要先解析出一个仓库；没有仓库就拒答 ----
- slug: confusable.offline-needs-a-repo
  question: "can I use it offline?"
  expect:
    refuses: true

# ---- 双语：同一个引擎服务两种语言，拒答要跟着问句的语言走 ----
- slug: refuse.zh-follows-the-question
  question: "你们有卖保险吗？"
  expect:
    refuses: true
    answer_contains: ["我"]
