# content/curation.yaml
#
# 手工实体 + 对 ingest 结果的覆盖。
#
# 为什么需要它：ingest 只能给事实，"口吻"和"归类"给不了。
#   - GitHub profile 的 bio 是 "Plasticity, Elasticity, Torsion." —— 那不是简历语言，
#     bot 不该照搬。
#   - 42 个仓库是平的，人看到的是家族（Finance Management = 3 个仓库）。
#   - GitHub topic 覆盖不全：三个 finance 仓库里只有一个带 finance topic。
#
# 这份文件是维护 agent 最该动的地方：它在这里提的是"判断"，不是"搬运"。
# 它进 git，所以判断也会被 review、被回滚、有历史。

entities:
  - type: person
    key: plae-tljg
    name: LKM
    summary: "Builds offline-first tools, Android automation, and AI-maintained systems."
    url: https://github.com/plae-tljg
    # 站点地址放在实体上，不写进模板：换域名只改这一处，
    # 而 knowledge.yaml 的 site.* 行只做插值。
    attrs:
      site: https://plae-tljg.github.io/
      projects: https://plae-tljg.github.io/zh/projects/
      writing: https://plae-tljg.github.io/zh/writing/
      docs: https://plae-tljg.github.io/zh/docs/
      licenses: "MIT for most of them; the MUSA voice ports keep their upstream AGPL/GPL licences, and several small repos have no licence file at all."
    # "you" / "your" / 你 / 您 是同一个人的说法。没有这几个别名，
    # "what is your website" 这类问句解析不出 {person}，整行就永远不会命中。
    aliases: ["LKM", "lkm", "plaetljg", "plae tljg", "you", "your", "你", "您"]

  # 项目分组：GitHub API 里没有这个信息，是最值得让 AI 提的那类改动
  - type: project
    key: project:finance-management
    name: Finance Management
    summary: "Offline personal finance apps: mobile, web, and a Lux variant."
    links:
      - { type: includes, to: "plae-tljg/Finance-Management-App" }
      - { type: includes, to: "ellkaimu/Finance-Management-Web" }
      - { type: includes, to: "plae-lkm/Finance_Lux_Web" }

  - type: project
    key: project:voice-musa
    name: Voice Cloning on MUSA
    summary: "Voice cloning and TTS stacks ported to MooreThreads GPUs."
    links:
      - { type: includes, to: "LKM-Repo/GPT-SoVITS-Musa" }
      - { type: includes, to: "LKM-Repo/so-vits-svc-musa" }
      - { type: includes, to: "LKM-Repo/Retrieval-based-Voice-Conversion-WebUI-musa" }

  - type: topic
    key: topic:finance
    attrs: { curated: 1 }
    name: Finance
    summary: "Money, budgeting and personal-finance tooling."

  # GitHub topics 里没有 machine-learning，访客的问法就落不到任何一个 topic 上。
  # 成员是判断，不是抓取：每个仓库的描述都明确提到模型 / 训练 / transformer。
  - type: topic
    key: topic:machine-learning
    attrs: { curated: 1 }
    name: Machine Learning
    summary: "Projects that port, train, or apply ML models: TTS and voice conversion, RAG, and transformers."

  # 访客不会说 "kotlin" 或 "webview"，会说 "android"；也不会有 "automation" 这个
  # topic —— GitHub 上都是 maa / fgo / frida 这类专名。下面三个 topic 补的是归类。
  - type: topic
    key: topic:android
    attrs: { curated: 1 }
    name: Android
    summary: "Android apps and on-device automation, including the MaaFramework work."

  - type: topic
    key: topic:web
    attrs: { curated: 1 }
    name: Web
    summary: "Small static sites and browser-side tools, including this site."

  - type: topic
    key: topic:automation
    attrs: { curated: 1 }
    name: Automation
    summary: "Scripts and tools that drive something else: phones, cables, routers, terminals."

# 覆盖 ingest 出来的字段。两边合并时这里的优先级更高，
# 所以重新 ingest 不会覆盖掉人工/AI 的判断。
#
# `type` 是可选的，但写上有好处：登录名 plae-tljg 同时是 account 和 person，
# 不写 type 时匹配到哪个取决于顺序。写明类型的覆盖不会随顺序变。
overrides:
  - key: plae-tljg
    type: account
    summary: "Primary account: the personal site, the DeepSeek Harness review plugin, and MaaFwPhoneAI."

  # account.about 直接念 summary，而 ingest 给不出"这个账号是干什么的"。
  # 没有这几句，"what is LKM-Repo?" 会答出一个只有名字的空壳。
  - key: LKM-Repo
    type: account
    summary: "Organization for templates and experiments: the MUSA GPU ports, the domain-ops agent, and assorted AI experiments."

  - key: plae-lkm
    type: account
    summary: "Smaller projects: joke pages, terminal and cable tools, and the Ubuntu setup manual."

  - key: ellkaimu
    type: account
    summary: "Earlier, more finished Android apps: SSH and SFTP, anime downloads, image organising, and a collaborative editor."

  - key: "plae-tljg/plae-tljg"
    summary: "The GitHub profile README."

  - key: "plae-tljg/MaaFwPhoneAI"
    set:
      fork: true
    summary: "A general-purpose Android GUI layer built on MaaFramework."

  # topic 覆盖不全，这里补齐。这正是 AI 该提的改动：GitHub 不知道这三个是一家人。
  - key: "plae-tljg/Finance-Management-App"
    add_aliases: ["finance app", "fma"]
    add_links: [{ type: tagged, to: "topic:finance" }]

  - key: "ellkaimu/Finance-Management-Web"
    add_links: [{ type: tagged, to: "topic:finance" }]

  - key: "plae-lkm/Finance_Lux_Web"
    add_links: [{ type: tagged, to: "topic:finance" }]

  # 命名近失误：仓库描述写的是 "2d three body system animation"，
  # 访客会说 "three body simulation"。机械生成的 alias 抓不到这个说法。
  - key: "plae-lkm/ThreeBodySystemAnimation"
    add_aliases: ["three body simulation"]

  # ML 分组的成员。GitHub 的 topics 是 gpt-sovits / transformers / pike-rag 这类
  # 细标签，没有一个访客会用的 "machine learning"；这里补的是归类，不是事实。
  - key: "LKM-Repo/GPT-SoVITS-Musa"
    add_links: [{ type: tagged, to: "topic:machine-learning" }]

  - key: "LKM-Repo/so-vits-svc-musa"
    add_links: [{ type: tagged, to: "topic:machine-learning" }]

  - key: "LKM-Repo/Retrieval-based-Voice-Conversion-WebUI-musa"
    add_links: [{ type: tagged, to: "topic:machine-learning" }]

  - key: "LKM-Repo/PIKE-RAG_Verbose"
    add_links: [{ type: tagged, to: "topic:machine-learning" }]

  - key: "LKM-Repo/Transformer-Implementation-C-Python"
    add_links: [{ type: tagged, to: "topic:machine-learning" }]

# Android 的成员：仓库描述里都明确写着 Android / Android app / Flutter Android。
